# LoteoManager - Docker Compose para Dokploy
# PocketBase NO se expone al host. Acceso solo vía red interna o Cloudflare Tunnel.

services:
  pocketbase:
    build:
      context: ../
      dockerfile: docker/pocketbase.Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.23.0}
    container_name: loteo_pocketbase
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - pb_data:/pb_data
      - ../pb_migrations:/pb_migrations:ro
      - ../pb_hooks:/pb_hooks:ro
    networks:
      - loteo_network
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin-web:
    build:
      context: ../
      dockerfile: docker/admin.Dockerfile
    container_name: loteo_admin
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - loteo_network
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  landing-ssr:
    build:
      context: ../
      dockerfile: docker/landing.Dockerfile
    container_name: loteo_landing
    restart: unless-stopped
    expose:
      - "4000"
    networks:
      - loteo_network
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - PORT=4000
      - NODE_ENV=production
      - PB_INTERNAL_URL=http://pocketbase:8080
      - PB_SERVICE_USER=${PB_SERVICE_USER}
      - PB_SERVICE_PASSWORD=${PB_SERVICE_PASSWORD}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - INMOBILIARIA_NOMBRE=${INMOBILIARIA_NOMBRE:-LoteoManager}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: loteo_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - loteo_network
    depends_on:
      admin-web:
        condition: service_healthy
      landing-ssr:
        condition: service_healthy

volumes:
  pb_data:
    driver: local

networks:
  loteo_network:
    driver: bridge
