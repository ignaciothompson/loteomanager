<div class="min-h-screen w-full flex items-center justify-center p-6 lm-login-page">
  <div class="relative w-full max-w-[400px] py-10 px-9 lm-login-card">
    <button
      type="button"
      class="absolute top-4 right-4 w-8 h-8 inline-flex items-center justify-center cursor-pointer lm-login-theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="'Cambiar tema'"
      [attr.aria-pressed]="isDark()"
    >
      <i [class]="themeIcon()" aria-hidden="true"></i>
    </button>

    <div class="flex items-center justify-center gap-2.5 mb-7">
      <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg lm-login-brand-mark" aria-hidden="true">
        <i class="pi pi-map-marker"></i>
      </span>
      <span class="text-[15px] font-medium">LoteoManager</span>
    </div>

    <h1 class="text-[22px] font-medium text-center mb-1.5">Iniciá sesión</h1>
    <p class="text-sm text-center mb-7 lm-login-muted">Accedé al panel de administración</p>

    <form class="flex flex-col gap-4" (ngSubmit)="login()" #loginForm="ngForm">
      <div class="flex flex-col">
        <label for="email" class="text-[13px] font-medium mb-1.5">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          pInputText
          class="w-full"
          placeholder="tu@email.com"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="flex flex-col">
        <label for="password" class="text-[13px] font-medium mb-1.5">Contraseña</label>
        <p-password
          inputId="password"
          name="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [feedback]="false"
          [toggleMask]="true"
          [styleClass]="'w-full'"
          [inputStyleClass]="'w-full'"
          [(ngModel)]="password"
          required
        ></p-password>
      </div>

      @if (errorMsg()) {
        <p class="text-sm -mt-1 lm-login-error" role="alert">{{ errorMsg() }}</p>
      }

      <div class="flex items-center justify-between gap-3 mt-1">
        <label class="inline-flex items-center gap-2 text-[13px] cursor-pointer">
          <p-checkbox name="rememberMe" inputId="rememberMe" [binary]="true" [(ngModel)]="rememberMe"></p-checkbox>
          <span>Recordarme</span>
        </label>
        <a routerLink="/auth/recuperar" class="text-[13px] hover:underline lm-login-link">¿Olvidaste tu contraseña?</a>
      </div>

      <p-button
        type="submit"
        label="Ingresar"
        styleClass="lm-login-submit w-full"
        severity="primary"
        [loading]="loading()"
      ></p-button>

      @if (isDev) {
        <div class="mt-2 p-3 rounded-lg text-xs lm-login-muted border border-dashed">
          <p class="m-0 mb-2">Testing local (seed migración):</p>
          <code class="block mb-2">admin@loteomanager.com / admin1234</code>
          <p-button
            type="button"
            label="Usar credenciales dev"
            severity="secondary"
            [text]="true"
            size="small"
            (click)="fillDevCredentials()"
          />
        </div>
      }
    </form>

    <div class="mt-7 pt-4 text-center text-xs lm-login-footer">
      <span>LoteoManager &copy; {{ currentYear }}</span>
    </div>
  </div>
</div>
