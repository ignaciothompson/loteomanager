<div class="default-height">
  <p-toast />

  <div class="card mb-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold m-0">Exportador</h1>
        <p class="text-sm text-surface-500 m-0 mt-1">
          Descargá un Excel con barrios y unidades (según tu acceso) para respaldo o análisis.
        </p>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flex flex-col gap-2 mb-4 max-w-xl">
      <label class="font-semibold text-sm">Barrios a exportar</label>
      <p-multiSelect
        [options]="barrioOpts()"
        [ngModel]="barrioIdsSeleccionados()"
        (ngModelChange)="barrioIdsSeleccionados.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar barrios…"
        display="chip"
        [filter]="true"
        [loading]="loading()"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-wrap gap-2 mb-4">
      <p-button
        label="Seleccionar todos"
        severity="secondary"
        [outlined]="true"
        (onClick)="seleccionarTodos()"
        [disabled]="!barrioOpts().length"
      />
      <p-button
        label="Limpiar selección"
        severity="secondary"
        [text]="true"
        (onClick)="limpiarSeleccion()"
      />
    </div>

    <p class="text-sm text-surface-600 mb-4">
      El Excel incluye una hoja <strong>Barrios</strong> (nombre, slug, zona, cantidad de unidades)
      y una hoja <strong>Unidades</strong> (barrio, código, tipo, estado, precio, moneda, área m²,
      visible en web).
    </p>

    <p-button
      label="Descargar Excel"
      icon="pi pi-download"
      [loading]="exporting()"
      [disabled]="!barrioIdsSeleccionados().length"
      (onClick)="exportar()"
    />
  </div>
</div>
