@if (formError()) {
  <p class="org-abm-dialog-error">{{ formError() }}</p>
}
<form [formGroup]="form" (ngSubmit)="onSubmit(false)" class="org-abm-form">
  <div class="flex flex-col gap-2">
    <label for="zona-nombre" class="font-semibold">Nombre *</label>
    <input #nombreInput pInputText id="zona-nombre" formControlName="nombre" class="w-full" />
    @if (showError(form.get('nombre'))) {
      <small class="text-red-500">Nombre requerido.</small>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="zona-depto" class="font-semibold">Departamento *</label>
    <p-select
      inputId="zona-depto"
      formControlName="departamento_id"
      [options]="departamentoOpts()"
      optionLabel="label"
      optionValue="value"
      placeholder="Seleccioná departamento"
      class="w-full"
      appendTo="body"
    />
  </div>
</form>

<div class="org-abm-dialog-footer">
  @if (!editingId()) {
    <button
      type="button"
      class="org-abm-link"
      [disabled]="saving() || form.invalid"
      (click)="onSubmit(true)"
    >
      Guardar y crear otro
    </button>
  }
  <span class="org-abm-dialog-footer__spacer"></span>
  <p-button
    label="Cancelar"
    icon="pi pi-times"
    severity="secondary"
    [text]="true"
    [disabled]="saving()"
    (click)="onCancel()"
  />
  <p-button
    label="Guardar"
    icon="pi pi-check"
    [loading]="saving()"
    [disabled]="form.invalid"
    (click)="onSubmit(false)"
  />
</div>
