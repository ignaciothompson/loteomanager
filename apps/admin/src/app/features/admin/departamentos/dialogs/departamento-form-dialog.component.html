@if (formError()) {
  <p class="org-abm-dialog-error">{{ formError() }}</p>
}
<form [formGroup]="form" (ngSubmit)="onSubmit(false)" class="org-abm-form">
  <div class="flex flex-col gap-2">
    <label for="dept-nombre" class="font-semibold">Nombre *</label>
    <input
      #nombreInput
      pInputText
      id="dept-nombre"
      formControlName="nombre"
      class="w-full"
    />
    @if (showError(form.get('nombre'))) {
      <small class="text-red-500">Nombre requerido.</small>
    }
  </div>
</form>

<div class="org-abm-dialog-footer">
  @if (!editingId()) {
    <button
      type="button"
      class="org-abm-link"
      [disabled]="saving() || form.invalid"
      (click)="onSubmit(true)"
    >
      Guardar y crear otro
    </button>
  }
  <span class="org-abm-dialog-footer__spacer"></span>
  <p-button
    label="Cancelar"
    icon="pi pi-times"
    severity="secondary"
    [text]="true"
    [disabled]="saving()"
    (click)="onCancel()"
  />
  <p-button
    label="Guardar"
    icon="pi pi-check"
    [loading]="saving()"
    [disabled]="form.invalid"
    (click)="onSubmit(false)"
  />
</div>
