<div class="default-height">
  <div class="card">
    <div class="departamentos-filters">
      <div class="departamentos-filters__field">
        <input
          pInputText
          type="text"
          placeholder="Buscar por nombre…"
          class="w-full"
          [ngModel]="filterNombre()"
          (ngModelChange)="filterNombre.set($event)"
        />
      </div>
      <div class="departamentos-filters__actions">
        @if (hasActiveFilters()) {
          <button
            pButton
            type="button"
            label="Limpiar"
            icon="pi pi-filter-slash"
            class="p-button-text"
            (click)="clearFilters()"
          ></button>
        }
      </div>
    </div>
  </div>

  <div class="card">
    <p-toast />

    <div class="default-height__header flex justify-between items-center mb-4">
      <h5 class="m-0">Departamentos</h5>
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Nuevo departamento"
        class="p-button-success"
        (click)="openNew()"
      ></button>
    </div>

    <div class="default-height__scroll">
      <p-table
        [value]="rowsFiltradas()"
        [scrollable]="true"
        scrollHeight="flex"
        [rows]="20"
        [paginator]="true"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Nombre</th>
            <th>Slug</th>
            <th class="buttons-col"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.nombre }}</td>
            <td><code>{{ row.slug }}</code></td>
            <td class="buttons-col">
              @if (!isTodo(row)) {
                <button
                  pButton
                  type="button"
                  icon="pi pi-pencil"
                  class="p-button-secondary p-button-text mr-2"
                  [attr.aria-label]="'Editar'"
                  (click)="openEdit(row)"
                ></button>
                <button
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  class="p-button-danger p-button-text"
                  [attr.aria-label]="'Eliminar'"
                  (click)="tryDelete(row)"
                ></button>
              }
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3">No hay departamentos.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<app-departamento-form-dialog
  [visible]="formVisible()"
  (visibleChange)="formVisible.set($event)"
  [editingId]="editingId()"
  [current]="current()"
  (save)="onSave($event)"
/>
